name: structify
description: "Structify"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter

  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  lucide_icons_flutter: ^3.1.14+2
  open_filex: ^4.7.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: VisbyRoundCF
      fonts:
        - asset: assets/fonts/VisbyRoundCF-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/VisbyRoundCF-Light.otf
          weight: 300
        - asset: assets/fonts/VisbyRoundCF-Regular.otf
          weight: 400
        - asset: assets/fonts/VisbyRoundCF-Medium.otf
          weight: 500
        - asset: assets/fonts/VisbyRoundCF-DemiBold.otf
          weight: 600
        - asset: assets/fonts/VisbyRoundCF-Bold.otf
          weight: 700
        - asset: assets/fonts/VisbyRoundCF-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/VisbyRoundCF-Heavy.otf
          weight: 900
